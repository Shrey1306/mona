[project]
name = "noma"
version = "0.1.0"
description = "Surgical telemedicine platform with 3D visualization and automated transcriptions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "opencv-python>=4.8.0",
    "nano-graphrag>=0.0.1",
    "neo4j>=5.0.0",
    "networkx>=3.0",
    "pyvis>=0.3.0",
    "ollama>=0.1.0",
    "python-dotenv>=1.0.0",
    "gradio>=4.0.0",
    "pypdf2>=3.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "faiss-cpu>=1.7.0",
    "openai>=1.0.0",
    "boto3>=1.34.0",
    "moviepy>=1.0.0",
    "pydub>=0.25.0",
]

[project.scripts]
noma = "noma.__main__:main"
noma-ehr = "noma.rag.ehr:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noma"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
